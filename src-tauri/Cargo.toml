[package]
name = "disaster-commander-edge"
version = "0.1.0"
description = "Disaster Commander Edge desktop shell"
authors = ["Basyid"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
